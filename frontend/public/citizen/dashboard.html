<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CitizenConnect — My Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <div class="main-body">
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Main</div>
        <a class="nav-link active" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
        <a class="nav-link" href="submit.html"><span class="icon">➕</span> Submit Issue</a>
        <a class="nav-link" href="my-issues.html"><span class="icon">📋</span> My Issues</a>
        <a class="nav-link" href="notifications.html"><span class="icon">🔔</span> Notifications</a>
      </div>
      <div class="sidebar-section" style="margin-top:1rem">
        <div class="sidebar-label">Account</div>
        <a class="nav-link" href="profile.html"><span class="icon">👤</span> Profile</a>
      </div>
    </nav>
    <main class="content-area">
      <div id="content">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  const user = requireAuth('citizen');
  if (user) {
    buildTopbar(document.getElementById('topbar'), false);
    loadDashboard();
  }

  async function loadDashboard() {
    try {
      const [issuesData, reportsData, notifsData] = await Promise.all([
        API.getIssues({ limit: 5 }),
        API.getReports(),
        API.getNotifs()
      ]);
      const r = reportsData.data;
      const unread = notifsData.unreadCount;

      document.getElementById('content').innerHTML = `
        <h2 style="font-size:20px;font-weight:600;margin-bottom:1.5rem">
          Welcome back, ${user.name.split(' ')[0]} 👋
        </h2>

        ${unread > 0 ? `<div class="alert alert-info">🔔 You have <strong>${unread}</strong> unread notification${unread > 1 ? 's' : ''}. <a href="notifications.html">View all</a></div>` : ''}

        <div class="stat-grid">
          <div class="stat-card blue">
            <div class="stat-number">${r.total}</div>
            <div class="stat-label">Total submitted</div>
          </div>
          <div class="stat-card amber">
            <div class="stat-number">${r.pending}</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" style="color:var(--blue)">${r.in_progress}</div>
            <div class="stat-label">In progress</div>
          </div>
          <div class="stat-card green">
            <div class="stat-number">${r.resolved + r.closed}</div>
            <div class="stat-label">Resolved</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <h3 class="card-title">Recent issues</h3>
          <a href="submit.html" class="btn btn-primary btn-sm">+ Submit new</a>
        </div>

        ${issuesData.issues.length === 0 ? `
          <div class="empty-state">
            <div class="icon">📝</div>
            <h3>No issues yet</h3>
            <p>Submit your first issue to get started.</p>
            <a href="submit.html" class="btn btn-primary" style="margin-top:1rem">Submit an issue</a>
          </div>` :
          issuesData.issues.map(issue => `
            <a class="issue-item" href="issue-detail.html?id=${issue._id}">
              <div class="issue-item-header">
                <div>
                  <div class="issue-item-title">${issue.title}</div>
                  <div class="issue-item-meta">
                    <span>🏷️ ${issue.category}</span>
                    <span>📍 ${issue.location.description}</span>
                    <span>📅 ${formatDate(issue.createdAt)}</span>
                    <span style="font-family:monospace;font-size:11px;background:var(--gray-light);padding:2px 6px;border-radius:4px">${issue.trackingNumber}</span>
                  </div>
                </div>
                ${statusBadge(issue.status)}
              </div>
              ${issue.response ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted)">💬 <em>${issue.response.slice(0, 100)}${issue.response.length > 100 ? '...' : ''}</em></div>` : ''}
            </a>`).join('')
        }
        ${issuesData.total > 5 ? `<a href="my-issues.html" class="btn btn-secondary" style="margin-top:.5rem">View all ${issuesData.total} issues →</a>` : ''}
      `;
    } catch (err) {
      document.getElementById('content').innerHTML = `<div class="alert alert-error">Failed to load dashboard: ${err.message}</div>`;
    }
  }
</script>
</body>
</html>
