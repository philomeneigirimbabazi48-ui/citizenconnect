<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CitizenConnect — Profile</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <div class="main-body">
    <nav class="sidebar">
      <div class="sidebar-section">
        <a class="nav-link" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
        <a class="nav-link" href="submit.html"><span class="icon">➕</span> Submit Issue</a>
        <a class="nav-link" href="my-issues.html"><span class="icon">📋</span> My Issues</a>
        <a class="nav-link" href="notifications.html"><span class="icon">🔔</span> Notifications</a>
      </div>
      <div class="sidebar-section" style="margin-top:1rem">
        <a class="nav-link active" href="profile.html"><span class="icon">👤</span> Profile</a>
      </div>
    </nav>
    <main class="content-area">
      <h2 style="font-size:20px;font-weight:600;margin-bottom:1.5rem">My Profile</h2>
      <div id="alert-box"></div>
      <div id="content"><div class="loading"><div class="spinner"></div></div></div>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  requireAuth('citizen');
  buildTopbar(document.getElementById('topbar'), false);
  const user = Auth.user;

  document.getElementById('content').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:1.5rem;align-items:start">
      <div class="card" style="text-align:center">
        <div class="avatar" style="width:72px;height:72px;font-size:24px;margin:0 auto 1rem">${initials(user.name)}</div>
        <div style="font-size:18px;font-weight:600">${user.name}</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:4px">${user.email}</div>
        <div style="margin-top:8px">${statusBadge('resolved').replace('resolved','').replace('Resolved','').replace('badge-resolved','badge badge-resolved').trim()}
          <span class="badge badge-resolved" style="font-size:12px">Citizen</span>
        </div>
        <div style="margin-top:1rem;font-size:12px;color:var(--text-muted)">
          Member since ${formatDate(user.createdAt)}
        </div>
        <button class="btn btn-danger btn-sm" style="margin-top:1.5rem;width:100%" onclick="Auth.logout()">Sign out</button>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:1.25rem">Edit Profile</div>
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="p-name" value="${user.name || ''}">
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" value="${user.email || ''}" disabled style="opacity:0.6;cursor:not-allowed">
          <div class="form-hint">Email cannot be changed.</div>
        </div>
        <div class="form-group">
          <label>Phone number</label>
          <input type="tel" id="p-phone" value="${user.phone || ''}" placeholder="+250 788 000 000">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>District</label>
            <input type="text" id="p-district" value="${user.district || ''}" placeholder="e.g. Kicukiro">
          </div>
          <div class="form-group">
            <label>Sector</label>
            <input type="text" id="p-sector" value="${user.sector || ''}" placeholder="e.g. Remera">
          </div>
        </div>
        <div class="form-group">
          <label>Province</label>
          <input type="text" id="p-province" value="${user.province || ''}" placeholder="e.g. Kigali">
        </div>
        <button class="btn btn-primary" onclick="saveProfile()">Save changes</button>
      </div>
    </div>
  `;

  async function saveProfile() {
    try {
      const data = await API.updateProfile({
        name: document.getElementById('p-name').value,
        phone: document.getElementById('p-phone').value,
        district: document.getElementById('p-district').value,
        sector: document.getElementById('p-sector').value,
        province: document.getElementById('p-province').value
      });
      Auth.user = data.user;
      showAlert(document.getElementById('alert-box'), 'Profile updated successfully!', 'success');
    } catch (err) {
      showAlert(document.getElementById('alert-box'), err.message, 'error');
    }
  }
</script>
</body>
</html>
