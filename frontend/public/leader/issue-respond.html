<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CitizenConnect — Respond to Issue</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <div class="main-body">
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Leader Panel</div>
        <a class="nav-link" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
        <a class="nav-link active" href="all-issues.html"><span class="icon">📥</span> All Issues</a>
        <a class="nav-link" href="reports.html"><span class="icon">📈</span> Reports</a>
        <a class="nav-link" href="notifications.html"><span class="icon">🔔</span> Notifications</a>
      </div>
    </nav>
    <main class="content-area">
      <a href="all-issues.html" class="btn btn-secondary btn-sm" style="margin-bottom:1rem">← Back to all issues</a>
      <div id="content"><div class="loading"><div class="spinner"></div></div></div>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  requireAuth('leader');
  buildTopbar(document.getElementById('topbar'), true);
  const issueId = new URLSearchParams(location.search).get('id');
  if (!issueId) location.href = 'all-issues.html';
  else loadIssue();

  let currentIssue = null;

  async function loadIssue() {
    try {
      const data = await API.getIssue(issueId);
      currentIssue = data.issue;
      const i = currentIssue;

      document.getElementById('content').innerHTML = `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-family:monospace;font-size:12px;background:var(--gray-light);padding:3px 10px;border-radius:6px;display:inline-block;margin-bottom:8px">${i.trackingNumber}</div>
            <h2 style="font-size:20px;font-weight:600">${i.title}</h2>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
              ${statusBadge(i.status)} ${priorityBadge(i.priority)}
              <span style="font-size:13px;color:var(--text-muted)">🏷️ ${i.category}</span>
              <span style="font-size:13px;color:var(--text-muted)">👤 ${i.citizenName}</span>
              <span style="font-size:13px;color:var(--text-muted)">📅 ${formatDate(i.createdAt)}</span>
            </div>
          </div>
          <!-- Quick status buttons -->
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="quickStatus('in_progress')" ${i.status === 'in_progress' ? 'disabled' : ''}>🔄 Mark In Progress</button>
            <button class="btn btn-sm" style="background:var(--green);color:#fff;border:none" onclick="quickStatus('resolved')" ${i.status === 'resolved' ? 'disabled' : ''}>✅ Mark Resolved</button>
            <button class="btn btn-danger btn-sm" onclick="quickStatus('rejected')" ${i.status === 'rejected' ? 'disabled' : ''}>✗ Reject</button>
          </div>
        </div>

        <div id="action-alert"></div>

        <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:1.5rem;align-items:start">
          <div>
            <!-- Issue Detail -->
            <div class="card" style="margin-bottom:1rem">
              <div class="card-title" style="margin-bottom:1rem">📝 Citizen's Report</div>
              <div style="background:var(--gray-light);border-radius:var(--radius);padding:1rem;font-size:14px;line-height:1.7;color:var(--text-muted);margin-bottom:1rem">${i.description}</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
                <div><strong>📍 Location:</strong><br><span style="color:var(--text-muted)">${i.location.description}</span></div>
                ${i.location.district ? `<div><strong>🏛️ District / Sector:</strong><br><span style="color:var(--text-muted)">${i.location.district}${i.location.sector ? ', ' + i.location.sector : ''}</span></div>` : ''}
              </div>
              ${i.photos?.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem">
                ${i.photos.map(p => `<img src="http://localhost:5000${p}" style="width:110px;height:80px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)">`).join('')}
              </div>` : ''}
            </div>

            <!-- Response panel -->
            <div class="card" style="margin-bottom:1rem">
              <div class="card-title" style="margin-bottom:1rem">💬 Respond to Citizen</div>

              <!-- AI Suggest button -->
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
                <label style="font-size:13px;font-weight:500;color:var(--text-muted)">Your response</label>
                <button class="btn btn-secondary btn-sm" onclick="getAISuggestion()" id="ai-btn">
                  🤖 Get AI suggestion
                </button>
              </div>

              <div id="ai-suggestion-box" style="display:none" class="ai-suggestion" style="margin-bottom:1rem">
                <div class="ai-tag">🤖 AI Suggested Response</div>
                <p id="ai-text" style="font-size:14px;line-height:1.6;margin:6px 0"></p>
                <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="useAISuggestion()">Use this response</button>
              </div>

              <textarea id="resp-text" placeholder="Write your response, solution, or update for the citizen..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;min-height:120px;resize:vertical;font-family:inherit;outline:none">${i.response || ''}</textarea>

              <div class="form-row" style="margin-top:1rem">
                <div class="form-group">
                  <label>Resolution time estimate</label>
                  <input type="text" id="resp-time" placeholder="e.g. 3-5 business days" value="${i.resolutionTime || ''}">
                </div>
                <div class="form-group">
                  <label>Update status to</label>
                  <select id="resp-status">
                    <option value="">Keep current (${i.status.replace('_',' ')})</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                  </select>
                </div>
              </div>

              <button class="btn btn-primary" onclick="sendResponse()" id="resp-btn">📤 Send Response to Citizen</button>
            </div>

            <!-- Comments -->
            <div class="card">
              <div class="card-title" style="margin-bottom:1rem">💬 Comments (${i.comments?.length || 0})</div>
              ${(i.comments || []).map(c => `
                <div style="display:flex;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
                  <div class="avatar ${c.authorRole === 'leader' ? 'leader' : ''}">${initials(c.authorName)}</div>
                  <div>
                    <div style="font-size:13px;font-weight:500">${c.authorName} <span style="font-weight:400;color:var(--text-muted);font-size:11px">(${c.authorRole})</span> · <span style="color:var(--text-muted);font-size:11px">${timeAgo(c.createdAt)}</span></div>
                    <div style="font-size:13px;color:var(--text-muted);margin-top:3px">${c.text}</div>
                  </div>
                </div>`).join('') || '<p style="font-size:13px;color:var(--text-muted)">No comments yet.</p>'}
              <div style="margin-top:1rem;display:flex;gap:8px">
                <input type="text" id="comment-input" placeholder="Add an internal note..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none">
                <button class="btn btn-secondary btn-sm" onclick="addComment()">Send</button>
              </div>
            </div>
          </div>

          <!-- Timeline + Citizen info sidebar -->
          <div>
            <div class="card" style="margin-bottom:1rem">
              <div class="card-title" style="margin-bottom:1rem">👤 Citizen Info</div>
              <div style="font-size:14px">
                <div style="margin-bottom:8px"><strong>Name:</strong> <span style="color:var(--text-muted)">${i.citizen?.name || i.citizenName}</span></div>
                <div style="margin-bottom:8px"><strong>Email:</strong> <span style="color:var(--text-muted)">${i.citizen?.email || '—'}</span></div>
                <div><strong>Phone:</strong> <span style="color:var(--text-muted)">${i.citizen?.phone || '—'}</span></div>
              </div>
            </div>

            <div class="card" style="margin-bottom:1rem">
              <div class="card-title" style="margin-bottom:1rem">🕐 Status Timeline</div>
              <div class="timeline">
                ${(i.statusHistory || []).map(h => `
                  <div class="tl-item">
                    <div class="tl-dot ${h.status === 'in_progress' ? 'blue' : h.status === 'pending' ? 'amber' : ''}"></div>
                    <div class="tl-content">
                      <div class="tl-title">${h.status.replace('_',' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                      <div class="tl-date">${formatDate(h.changedAt)} · ${h.changedByName || ''}</div>
                      ${h.note ? `<div class="tl-text">${h.note}</div>` : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </div>

            ${i.feedback?.rating ? `
              <div class="card">
                <div class="card-title" style="margin-bottom:.5rem">⭐ Citizen Feedback</div>
                <div class="stars" style="font-size:22px;margin:6px 0">${stars(i.feedback.rating)}</div>
                <p style="font-size:13px;color:var(--text-muted)">${i.feedback.comment || 'No comment.'}</p>
              </div>` : ''}
          </div>
        </div>
      `;
    } catch (err) {
      document.getElementById('content').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  async function getAISuggestion() {
    const btn = document.getElementById('ai-btn');
    btn.disabled = true; btn.textContent = '🤖 Thinking...';
    const i = currentIssue;
    try {
      const data = await API.suggestResponse({
        issueTitle: i.title,
        issueDescription: i.description,
        issueCategory: i.category,
        issueLocation: i.location.description
      });
      document.getElementById('ai-text').textContent = data.suggestion;
      document.getElementById('ai-suggestion-box').style.display = 'block';
    } catch (err) {
      alert('AI suggestion unavailable: ' + err.message);
    }
    btn.disabled = false; btn.textContent = '🤖 Get AI suggestion';
  }

  function useAISuggestion() {
    document.getElementById('resp-text').value = document.getElementById('ai-text').textContent;
    document.getElementById('ai-suggestion-box').style.display = 'none';
  }

  async function sendResponse() {
    const resp = document.getElementById('resp-text').value.trim();
    if (!resp) { alert('Please write a response first.'); return; }
    const btn = document.getElementById('resp-btn');
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      await API.respond(issueId, {
        response: resp,
        resolutionTime: document.getElementById('resp-time').value,
        status: document.getElementById('resp-status').value || undefined
      });
      showAlert(document.getElementById('action-alert'), '✅ Response sent to citizen successfully!', 'success');
      setTimeout(loadIssue, 1000);
    } catch (err) {
      showAlert(document.getElementById('action-alert'), err.message, 'error');
    }
    btn.disabled = false; btn.textContent = '📤 Send Response to Citizen';
  }

  async function quickStatus(status) {
    try {
      await API.updateStatus(issueId, { status, note: `Status updated by ${Auth.user.name}` });
      showAlert(document.getElementById('action-alert'), `✅ Status updated to "${status.replace('_',' ')}"`, 'success');
      setTimeout(loadIssue, 800);
    } catch (err) {
      showAlert(document.getElementById('action-alert'), err.message, 'error');
    }
  }

  async function addComment() {
    const input = document.getElementById('comment-input');
    if (!input?.value.trim()) return;
    try { await API.addComment(issueId, input.value.trim()); loadIssue(); }
    catch (err) { alert(err.message); }
  }
</script>
</body>
</html>
